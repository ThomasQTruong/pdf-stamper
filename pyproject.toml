[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-stamper"
version = "2.0.0"
authors = [
  { name="Thomas", email="TruongThomasQ@gmail.com" },
]
description = "A tool to mass stamp PDF files."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pymupdf>=1.24.11",
    "customtkinter>=5.2.0",
    "CTkToolTip>=0.9",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0.0",
    "pytest",
]

[project.scripts]
pdf-stamper-cli = "pdf_stamper.stamper_CLI:main"

[project.gui-scripts]
pdf-stamper = "pdf_stamper.stamper:main"

[tool.setuptools.packages.find]
where = ["src"]
